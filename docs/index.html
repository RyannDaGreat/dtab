<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
    :root {
        --bg: #0d0d0d;
        --panel: #161616;
        --border: #2a2a2a;
        --text: #e6e6e6;
        --muted: #8a8a8a;
        --accent: #5fd7ff;
        --error: #ff6b6b;
        --tab-glyph: #3a3a3a;
        --key-object: #d787d7;   /* same colors as dtab.vim */
        --key-leaf: #5fd7ff;
        --value: #3d8bff;
        --comment: #6a6a6a;
        --font-mono: "PT Mono", "SF Mono", Menlo, Consolas, monospace;
        --font-size: 14px;
        --line-height: 1.45;
        --tab-size: 4;
        --gap: 12px;
        --pad: 16px;
        --header-height: 48px;
        --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: var(--font-size); }
    header {
        height: var(--header-height); display: flex; align-items: center; gap: var(--gap);
        padding: 0 var(--pad); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: var(--font-size); font-weight: normal; }
    header h1 span { color: var(--accent); }
    header a { color: var(--muted); text-decoration: none; }
    header a:hover { color: var(--text); }
    header .spacer { flex: 1; }
    main { height: calc(100% - var(--header-height)); display: flex; gap: var(--gap); padding: var(--gap); }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .pane .label { padding: calc(var(--gap) / 2) var(--pad); color: var(--muted); border-bottom: 1px solid var(--border); }
    .pane .label b { color: var(--text); font-weight: normal; }
    .CodeMirror, pre {
        flex: 1; height: auto; padding: var(--pad); font: inherit; line-height: var(--line-height); tab-size: var(--tab-size);
        background: transparent; color: var(--text); overflow: auto; white-space: pre;
    }
    .CodeMirror-cursor { border-left-color: var(--text); }
    .CodeMirror-selected { background: var(--border); }
    .cm-dtab-object-key { color: var(--key-object); }
    .cm-dtab-leaf-key { color: var(--key-leaf); }
    .cm-dtab-value { color: var(--value); }
    .cm-dtab-comment { color: var(--comment); }
    .cm-dtab-bad-key { color: var(--error); text-decoration: underline wavy; }
    .cm-tab { position: relative; }
    .cm-tab::before { content: "\2192"; position: absolute; left: 0; color: var(--tab-glyph); }   /* → drawn under each tab */
    pre .k { color: var(--key-object); }
    pre .s { color: var(--value); }
    pre .error { color: var(--error); }
    @media (max-width: 720px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
    <h1><span>.dtab</span> &nbsp;config files made of tab-separated paths</h1>
    <div class="spacer"></div>
    <a href="https://github.com/RyannDaGreat/dtab">GitHub</a>
    <a href="https://pypi.org/project/dtab/">PyPI</a>
    <a href="https://www.npmjs.com/package/deltatab">npm</a>
</header>
<main>
    <section class="pane">
        <div class="label"><b>dtab</b> &middot; edit me &middot; tabs are shown as &rarr;</div>
        <textarea id="source"></textarea>
    </section>
    <section class="pane">
        <div class="label"><b>JSON</b> &middot; what parse() returns</div>
        <pre id="output"></pre>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deltatab/dtab.js"></script>
<script>
// If the CDN copy failed to load (offline), use the repo's own copy.
if (typeof dtab === 'undefined') document.write('<script src="../dtab.js"><\/script>')
</script>
<script>
'use strict'

// Every feature in one file, with tabs aligned the way a careful author would write them.
const EXAMPLE = [
    ' Tabs separate the steps of a path. The last entry is "key value".',
    'scene\tname Demo scene',
    'scene\twidth 1280',
    'scene\theight 720',
    '',
    ' Paths stack: these three lines all write into camera',
    'camera\tposition\tx 0\ty 5\tz 25',
    'camera\trotation\tx -10',
    'camera\tfov 50',
    '',
    ' Or go deep instead of wide. This is the same tree as one long line.',
    'lights',
    '\tkey',
    '\t\tintensity 1',
    '\t\tcolor\tr 1\tg .9\tb .8',
    '\tfill',
    '\t\tintensity .3',
    '',
    ' a,b writes the same value under several keys',
    'lights\tkey,fill\tcastShadow true',
    '',
    ' Writing a key again replaces it. Last line wins.',
    'camera\tfov 35',
    '',
    ' Every value is a string. Cast the ones you need.',
    'debug\tenabled false\tlevel 2',
].join('\n')

const KEY_NAME = /^[\p{XID_Start}_]\p{XID_Continue}*$/u   // same key rule as dtab.js (named differently: dtab.js already declares IDENTIFIER globally)

/**
 * Pure function. The CodeMirror token class for one dtab entry (the text between tabs).
 * A key part that is not an identifier is flagged; commas between identifiers are fine.
 *
 * @param {string} key - the entry's key (text before its first space, or the whole entry)
 * @param {boolean} isLeaf - whether the entry has a space (key value)
 * @returns {string}
 * @example entryClass('l1,l2', true)   // 'dtab-leaf-key'
 * @example entryClass('a.b', false)    // 'dtab-bad-key'
 */
function entryClass(key, isLeaf) {
    if (!key.split(',').every(name => KEY_NAME.test(name))) return 'dtab-bad-key'
    return isLeaf ? 'dtab-leaf-key' : 'dtab-object-key'
}

// A line is entries separated by tab runs. Each entry is a comment (starts with a space), a leaf
// (key, one space, value) or an object key. State is only "the next run is a value", per line.
CodeMirror.defineMode('dtab', () => ({
    startState: () => ({inValue: false}),
    token(stream, state) {
        if (stream.sol()) state.inValue = false
        if (state.inValue) {
            state.inValue = false
            stream.skipTo('\t') || stream.skipToEnd()
            return 'dtab-value'
        }
        if (stream.eatWhile('\t')) return 'tab'                        // CodeMirror styles 'tab' tokens as .cm-tab
        if (stream.eat(' ')) { stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-comment' }
        const start = stream.pos
        while (!stream.eol() && stream.peek() !== '\t' && stream.peek() !== ' ') stream.next()
        const key = stream.string.slice(start, stream.pos)
        const isLeaf = stream.peek() === ' '
        if (isLeaf) { stream.next(); state.inValue = !stream.eol() }
        return entryClass(key, isLeaf)
    },
}))

const output = document.getElementById('output')
const editor = CodeMirror.fromTextArea(document.getElementById('source'), {
    mode: 'dtab',
    indentWithTabs: true,
    tabSize: 4,
    lineWrapping: false,
    extraKeys: {Tab: cm => cm.replaceSelection('\t')},               // Tab inserts a tab; tabs are the whole point
})

/**
 * Pure function. JSON.stringify with keys and strings wrapped in spans for color.
 *
 * @param {object} tree
 * @returns {string} HTML
 * @example colorized({a: '1'})  // '{\n    <span class="k">"a"</span>: <span class="s">"1"</span>\n}'
 */
function colorized(tree) {
    const escaped = JSON.stringify(tree, null, 4).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]))
    return escaped.replace(/"((?:[^"\\]|\\.)*)"(:)?/g, (match, text, colon) =>
        colon ? '<span class="k">"' + text + '"</span>:' : '<span class="s">"' + text + '"</span>')
}

/** Command. Re-parses the editor into the right pane; shows the parser's error if there is one. */
function render() {
    try {
        output.innerHTML = colorized(dtab.parse(editor.getValue()))
    } catch (error) {
        output.innerHTML = '<span class="error">' + String(error.message).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])) + '</span>'
    }
}

editor.on('change', render)
editor.setValue(EXAMPLE)
editor.focus()
</script>
</body>
</html>
