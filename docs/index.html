<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtab - Delta Tab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
    :root {
        --bg: #0d0d0d;
        --panel: #161616;
        --border: #2a2a2a;
        --text: #e6e6e6;
        --muted: #8a8a8a;
        --accent: #5fd7ff;
        --error: #ff6b6b;
        --tab-glyph: #3a3a3a;
        --key-object: #d787d7;   /* same colors as dtab.vim */
        --key-leaf: #5fd7ff;
        --value: #3d8bff;
        --comment: #6a6a6a;
        --block-key: #ffd75f;    /* a $key: yellow, distinct from a leaf key */
        --block-tag: #d7875f;    /* the language tag after a $key: orange, italic */
        --block-text: #87afd7;   /* plain multiline text: lighter blue, italic; not a one-line value */
        --font-mono: "PT Mono", "SF Mono", Menlo, Consolas, monospace;
        --font-size: 14px;
        --line-height: 1.45;
        --tab-size: 4;
        --gap: 12px;
        --pad: 16px;
        --header-height: 48px;
        --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: var(--font-size); }
    header {
        height: var(--header-height); display: flex; align-items: center; gap: var(--gap);
        padding: 0 var(--pad); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: var(--font-size); font-weight: normal; }
    header h1 span { color: var(--accent); }
    header h1 b { color: var(--text); font-weight: normal; }
    header a { color: var(--muted); text-decoration: none; }
    header a:hover { color: var(--text); }
    header .spacer { flex: 1; }
    main { height: calc(100% - var(--header-height)); display: flex; gap: var(--gap); padding: var(--gap); }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .pane .label { display: flex; align-items: center; gap: var(--gap); padding: calc(var(--gap) / 2) var(--pad); color: var(--muted); border-bottom: 1px solid var(--border); }
    .pane .label b { color: var(--text); font-weight: normal; }
    .pane .label .spacer { flex: 1; }
    .pane .label label { cursor: pointer; user-select: none; }
    .pane .label input { vertical-align: middle; accent-color: var(--accent); }
    .CodeMirror, pre {
        flex: 1; height: auto; padding: var(--pad); font: inherit; line-height: var(--line-height); tab-size: var(--tab-size);
        background: transparent; color: var(--text); overflow: auto; white-space: pre;
    }
    .CodeMirror-cursor { border-left-color: var(--text); }
    .CodeMirror-selected { background: var(--border); }
    .highlight .cm-dtab-object-key { color: var(--key-object); }
    .highlight .cm-dtab-leaf-key { color: var(--key-leaf); }
    .highlight .cm-dtab-value { color: var(--value); }
    .highlight .cm-dtab-comment { color: var(--comment); }
    .highlight .cm-dtab-bad-key { color: var(--error); text-decoration: underline wavy; }
    .highlight .cm-dtab-block-key { color: var(--block-key); }
    .highlight .cm-dtab-block-tag { color: var(--block-tag); font-style: italic; }
    .highlight .cm-dtab-block-text { color: var(--block-text); font-style: italic; }
    /* tokens of a language embedded in a $ block (CodeMirror's standard class names) */
    .highlight .cm-keyword { color: var(--key-object); }
    .highlight .cm-string, .highlight .cm-string-2 { color: var(--value); }
    .highlight .cm-number, .highlight .cm-atom { color: var(--accent); }
    .highlight .cm-comment { color: var(--comment); }
    .highlight .cm-def, .highlight .cm-variable-2, .highlight .cm-tag, .highlight .cm-attribute, .highlight .cm-property { color: var(--key-leaf); }
    .highlight .cm-builtin, .highlight .cm-meta { color: var(--accent); }
    .show-tabs .cm-tab { position: relative; }
    .show-tabs .cm-tab::before { content: "\2192"; position: absolute; left: 0; color: var(--tab-glyph); }   /* → drawn under each tab */
    pre .k { color: var(--key-object); }
    pre .s { color: var(--value); }
    pre .error { color: var(--error); }
    @media (max-width: 720px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
    <h1><span>.dtab</span> &nbsp;<b>Delta Tab</b> &middot; config files made of tab-separated paths</h1>
    <div class="spacer"></div>
    <a href="https://github.com/RyannDaGreat/dtab">GitHub</a>
    <a href="https://pypi.org/project/dtab/">PyPI</a>
    <a href="https://www.npmjs.com/package/deltatab">npm</a>
</header>
<main>
    <section class="pane">
        <div class="label">
            <b>dtab</b> &middot; edit me
            <span class="spacer"></span>
            <label><input type="checkbox" id="toggle-highlight" checked> highlight</label>
            <label><input type="checkbox" id="toggle-tabs" checked> tabs &rarr;</label>
        </div>
        <textarea id="source"></textarea>
    </section>
    <section class="pane">
        <div class="label"><b>JSON</b> &middot; what parse() returns</div>
        <pre id="output"></pre>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/swift/swift.min.js"></script>
<script src="../dtab.js"></script>
<script>
// The repo's own dtab.js when served from a checkout (tests, local use). On GitHub Pages only docs/ is served,
// so that 404s and the same file is loaded from the repo through jsDelivr's GitHub mirror instead. The mirror
// caches a branch for up to ~12 hours; after a push that changes dtab.js, refresh it with
//   curl https://purge.jsdelivr.net/gh/RyannDaGreat/dtab@main/dtab.js
if (typeof dtab === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/gh/RyannDaGreat/dtab@main/dtab.js"><\/script>')
</script>
<script>
'use strict'

// Every feature in one file, with tabs aligned the way a careful author would write them.
const EXAMPLE = [
    ' Tabs separate the steps of a path. The last entry is "key value".',
    'scene\tname Demo scene',
    'scene\twidth 1280',
    'scene\theight 720',
    '',
    ' Paths stack: these three lines all write into camera',
    'camera\tposition\tx 0\ty 5\tz 25',
    'camera\trotation\tx -10',
    'camera\tfov 50',
    '',
    ' Or go deep instead of wide. This is the same tree as one long line.',
    'lights',
    '\tkey',
    '\t\tintensity 1',
    '\t\tcolor\tr 1\tg .9\tb .8',
    '\tfill',
    '\t\tintensity .3',
    '',
    ' a,b writes the same value under several keys. After the comma, spaces, tabs or a line break may follow.',
    'lights\tkey, fill\tcastShadow true',
    'lights\tkey,',
    '\tfill\tshadowBias .01',
    '',
    ' Writing a key again replaces it. Last line wins.',
    'camera\tfov 35',
    '',
    ' Every value is a string. Cast the ones you need.',
    'debug\tenabled false\tlevel 2',
    '',
    ' A leaf with lines under it is a multiline string. Its own text is a tag that picks the highlighting',
    ' and is not part of the value; an empty tag is plain text (a shebang inside still picks a language).',
    'query sql',
    '\tSELECT name, age',
    '\tFROM users',
    '\tWHERE age > 30',
    'setup ',
    '\t#!/bin/bash',
    '\tpip install rp',
].join('\n')

const KEY_NAME = dtab.KEY   // the parser's own key rule
// A key list within a line: runs of non-blanks, where a run ending in a comma goes on past spaces, then tabs
const KEYS = '[^\\t ]+(?:(?<=,) *\\t*[^\\t ]+)*'

/**
 * Pure function. The CodeMirror token class for one dtab entry (the text between tabs).
 * A key part with a character outside the bag (letters, digits, _ . - /) is flagged, and so is a comma with
 * no key on one side; the whitespace a comma allows after it is fine.
 *
 * @param {string} key - the entry's key (text before its value's space, or the whole entry)
 * @param {boolean} isLeaf - whether the entry has a value
 * @returns {string}
 * @example entryClass('l1,l2', true)     // 'dtab-leaf-key'
 * @example entryClass('l1, l2', false)   // 'dtab-object-key'
 * @example entryClass('a|b', false)      // 'dtab-bad-key'
 * @example entryClass('a,,b', false)     // 'dtab-bad-key'
 */
function entryClass(key, isLeaf) {
    if (!key.replace(/, *\t*/g, ',').split(',').every(name => KEY_NAME.test(name))) return 'dtab-bad-key'
    return isLeaf ? 'dtab-leaf-key' : 'dtab-object-key'
}

/**
 * Query (reads the lines after the stream's). How a key list that ends its line with a comma goes on: 'leaf'
 * or 'object' by what ends the list on a later line, or null when nothing valid follows (the end of the
 * text, or a line that does not start with a key after its tabs), which makes that comma an error.
 *
 * @example continuation(stream)   // 'leaf' when the stream is on 'x,' and the next line is 'y 1'
 * @example continuation(stream)   // 'object' when the stream is on 'alpha,' and the next line is '\tbeta\tport 80'
 * @example continuation(stream)   // null when the stream is on 'a,' and the next line is ' a comment'
 */
function continuation(stream) {
    for (let n = 1; ; n++) {
        const next = stream.lookAhead(n)
        if (next === undefined) return null
        if (/^\t*$/.test(next)) continue
        const match = new RegExp('^\\t*(' + KEYS + ')').exec(next)
        if (!match) return null
        if (!match[1].endsWith(',')) return next[match[0].length] === ' ' ? 'leaf' : 'object'
    }
}

// Language tag of a multiline string's header -> CodeMirror mode. No tag: a shebang on the first line, else plain.
const TAG_MODES = {
    sql: 'text/x-sql', python: 'python', py: 'python', javascript: 'javascript', js: 'javascript',
    typescript: 'text/typescript', ts: 'text/typescript', html: 'htmlmixed', css: 'css', json: 'application/json',
    yaml: 'yaml', yml: 'yaml', markdown: 'markdown', md: 'markdown',
    bash: 'shell', sh: 'shell', shell: 'shell', zsh: 'shell',
    c: 'text/x-csrc', cpp: 'text/x-c++src', rust: 'rust', go: 'go', java: 'text/x-java', swift: 'swift', dtab: 'dtab',
}

/**
 * Pure function. The language tag implied by a shebang line, or null.
 *
 * @example shebangTag('#!/bin/bash')            // 'bash'
 * @example shebangTag('#!/usr/bin/env python3') // 'python'
 * @example shebangTag('SELECT 1')               // null
 */
function shebangTag(line) {
    if (!line.startsWith('#!')) return null
    const match = line.match(/(bash|zsh|sh|python|node)\d*(?:\s|$)/)
    return match ? ({sh: 'bash', zsh: 'bash', node: 'javascript'}[match[1]] || match[1]) : null
}

/** Pure function. Number of leading tabs of a line. @example lineIndent('\t\tx') // 2 */
const lineIndent = line => line.length - line.replace(/^\t+/, '').length

const HEADER_LINE = new RegExp('^\\t*(?: [^\\t]*\\t+)*' + KEYS + '(?<!,) [^\\t]*(?:\\t+ [^\\t]*)*$')

/**
 * Pure function. Whether a line has the shape that opens a multiline string once a deeper line follows:
 * exactly one leaf and otherwise only comments. The parser's rule.
 * @example isHeaderLine('query sql\t note')   // true
 * @example isHeaderLine('x, y sql')           // true (one leaf with two keys)
 * @example isHeaderLine('x, y')               // false (two object keys, the space continues the list)
 * @example isHeaderLine('x 1\ty 2')           // false
 */
const isHeaderLine = line => HEADER_LINE.test(line)

/**
 * Query (reads the lines after the stream's). Whether the next non-blank line is deeper than the stream's line.
 * @example deeperFollows(stream)   // true when the stream is on 'query sql' and the next line is '\tSELECT 1'
 */
function deeperFollows(stream) {
    for (let n = 1; ; n++) {
        const next = stream.lookAhead(n)
        if (next === undefined) return false
        if (next.trim()) return lineIndent(next) > lineIndent(stream.string)
    }
}

/**
 * Near-pure function (looks up a CodeMirror mode). The state of a multiline string whose text is highlighted
 * as `tag`'s language: plain text when the tag is null or not in TAG_MODES.
 *
 * @example blockState(config, 0, 'sql')   // {indent: 0, tag: 'sql', mode: <the sql mode>, state: <its start state>}
 * @example blockState(config, 1, null)    // {indent: 1, tag: null, mode: null, state: null}
 */
function blockState(config, indent, tag) {
    const mode = tag && TAG_MODES[tag] ? CodeMirror.getMode(config, TAG_MODES[tag]) : null
    return {indent, tag, mode, state: mode ? CodeMirror.startState(mode) : null}
}

// A line is entries separated by tab runs. Each entry is a comment (starts with a space), a leaf
// (key, one space, value) or an object key. A line of one leaf with a deeper line after it is a multiline
// string's header: the lines under it are value text, handed to the tag's language mode if there is one.
CodeMirror.defineMode('dtab', config => ({
    // block: the multiline string the text from here on belongs to (a blockState); pending: one whose header
    // is the current line, so it starts on the next; header: the current line is a header; tagPending: the
    // tag is next.
    startState: () => ({inValue: false, block: null, pending: null, header: false, tagPending: false}),
    copyState: s => ({
        inValue: s.inValue, header: s.header, tagPending: s.tagPending,
        block: s.block && {...s.block, state: s.block.mode ? CodeMirror.copyState(s.block.mode, s.block.state) : null},
        pending: s.pending && {...s.pending, state: s.pending.mode ? CodeMirror.copyState(s.pending.mode, s.pending.state) : null},
    }),
    blankLine(state) { if (state.block && state.block.mode && state.block.mode.blankLine) state.block.mode.blankLine(state.block.state) },
    token(stream, state) {
        if (stream.sol()) {
            state.inValue = false
            state.tagPending = false
            if (state.pending) { state.block = state.pending; state.pending = null }
            if (state.block && stream.string.trim() && lineIndent(stream.string) <= state.block.indent) state.block = null   // string over
            state.header = !state.block && isHeaderLine(stream.string) && deeperFollows(stream)
        }
        if (state.tagPending) { state.tagPending = false; stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-block-tag' }
        if (state.block) {
            if (stream.eatWhile('\t')) return 'tab'
            if (!state.block.tag && stream.string.slice(stream.pos).trim())   // an untagged string's first text: a shebang picks its language
                state.block = blockState(config, state.block.indent, shebangTag(stream.string.slice(stream.pos).trim()) || 'text')
            if (state.block.mode) return state.block.mode.token(stream, state.block.state)
            stream.skipToEnd(); return 'dtab-block-text'
        }
        if (state.inValue) {
            state.inValue = false
            stream.skipTo('\t') || stream.skipToEnd()
            return 'dtab-value'
        }
        if (stream.eatWhile('\t')) return 'tab'                        // CodeMirror styles 'tab' tokens as .cm-tab
        if (stream.eat(' ')) { stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-comment' }
        const start = stream.pos
        do { while (!stream.eol() && stream.peek() !== '\t' && stream.peek() !== ' ') stream.next() }   // a key, going on past a comma's whitespace
        while (stream.string[stream.pos - 1] === ',' && stream.match(/^ *\t*(?=[^\t ])/))
        let key = stream.string.slice(start, stream.pos)
        const goesOn = key.endsWith(',') && stream.eol() ? continuation(stream) : null   // the list ends on a later line
        if (goesOn) key = key.slice(0, -1)
        const isLeaf = goesOn ? goesOn === 'leaf' : stream.peek() === ' '
        if (state.header && isLeaf) {                                   // the header's key, then its tag; the string starts on the next line
            const tag = stream.string.slice(stream.pos + 1).split('\t')[0]
            state.pending = blockState(config, lineIndent(stream.string), tag || null)
            state.tagPending = true
            return entryClass(key, true) === 'dtab-bad-key' ? 'dtab-bad-key' : 'dtab-block-key'
        }
        if (isLeaf && !goesOn) { stream.next(); state.inValue = !stream.eol() }
        return entryClass(key, isLeaf)
    },
}))

const output = document.getElementById('output')
const BLOCK_INDENT = '    '   // what the Tab key inserts inside a multiline string: code indents with spaces, tabs are dtab structure

/**
 * Query (reads editor state). Whether a line is inside a multiline string: the previous line ended in one
 * (a header does, its string pending), and this line is indented deeper than the header. A line of only
 * whitespace counts by its tabs too, so at the header's depth (or empty) it is structure and Tab gives a tab.
 *
 * @example insideBlock(cm, 2)   // true for line 2 of 'code python\n\tdef f():\n\t    return 1'
 * @example insideBlock(cm, 0)   // false: the header itself is a dtab line
 */
function insideBlock(cm, lineNumber) {
    if (lineNumber === 0) return false
    const state = cm.getStateAfter(lineNumber - 1, true)   // precise: the cached state is stale for ~400 ms after an edit above
    const block = state.block || state.pending
    if (!block) return false
    return lineIndent(cm.getLine(lineNumber)) > block.indent
}

/**
 * Pure function. One line shifted by one indentation level: spaces inside a block, a tab outside it.
 * Blank lines are left alone; outdenting removes what is there, up to one level.
 *
 * @example shiftLine('\tdef f():', true, 1)     // '\t    def f():'
 * @example shiftLine('\t    return', true, -1)  // '\treturn'
 * @example shiftLine('a\tb 1', false, 1)        // '\ta\tb 1'
 */
function shiftLine(line, inBlock, direction) {
    if (!line.trim()) return line
    if (!inBlock) return direction > 0 ? '\t' + line : line.replace(/^\t/, '')
    const tabs = lineIndent(line)
    const rest = line.slice(tabs)
    if (direction > 0) return line.slice(0, tabs) + BLOCK_INDENT + rest
    return line.slice(0, tabs) + rest.replace(new RegExp('^ {1,' + BLOCK_INDENT.length + '}'), '')
}

/**
 * Pure function. The lines a selection covers, as [first, last]. A selection that ends at column 0 of a
 * later line does not include that line (that is how Shift+Down selects whole lines), as in CodeMirror's
 * own indentSelection.
 *
 * @example selectedLines({line: 1, ch: 0}, {line: 3, ch: 0})   // [1, 2]
 * @example selectedLines({line: 1, ch: 2}, {line: 1, ch: 5})   // [1, 1]
 */
const selectedLines = (from, to) => [from.line, to.ch === 0 && to.line > from.line ? to.line - 1 : to.line]

/**
 * Pure function. The one insertion or deletion that turns `line` into `shifted` (a shift only adds or
 * removes indentation), as {at, insert} or {from, to}, or null when they are equal. Applying that instead
 * of replacing the line lets the editor keep carets and selections on their text.
 *
 * @example lineEdit('\tdef f():', '\t    def f():')   // {at: 1, insert: '    '}
 * @example lineEdit('\t    return', '\treturn')       // {from: 1, to: 5}
 * @example lineEdit('a', 'a')                         // null
 */
function lineEdit(line, shifted) {
    if (line === shifted) return null
    let at = 0
    while (line[at] === shifted[at]) at++
    if (shifted.length > line.length) return {at, insert: shifted.slice(at, at + shifted.length - line.length)}
    return {from: at, to: at + line.length - shifted.length}
}

/**
 * Command. Shifts every line the selection touches. Lines all inside $ blocks (blank ones aside) are code
 * and shift by spaces; a range touching structure (a header, or any line outside a string) shifts by tabs,
 * so a string moves with its header.
 */
function shiftSelection(cm, direction) {
    const [first, last] = selectedLines(cm.getCursor('from'), cm.getCursor('to'))
    let code = true
    for (let n = first; n <= last; n++) if (cm.getLine(n).trim() && !insideBlock(cm, n)) code = false
    cm.operation(() => {
        for (let n = first; n <= last; n++) {
            const change = lineEdit(cm.getLine(n), shiftLine(cm.getLine(n), code, direction))
            if (!change) continue
            if ('insert' in change) cm.replaceRange(change.insert, {line: n, ch: change.at})
            else cm.replaceRange('', {line: n, ch: change.from}, {line: n, ch: change.to})
        }
    })
}

/** Command. Tab: a selection indents its lines; a caret inside a block, past the line's tabs, gets spaces; else a tab. */
function insertTab(cm) {
    if (cm.somethingSelected()) return shiftSelection(cm, 1)
    const cursor = cm.getCursor()
    cm.replaceSelection(insideBlock(cm, cursor.line) && cursor.ch >= lineIndent(cm.getLine(cursor.line)) ? BLOCK_INDENT : '\t')
}

const editor = CodeMirror.fromTextArea(document.getElementById('source'), {
    mode: 'dtab',
    indentWithTabs: true,
    tabSize: 4,
    lineWrapping: false,
    maxHighlightLength: Infinity,   // a very long line would otherwise hide its multiline string from the mode
    extraKeys: {
        Tab: insertTab, 'Shift-Tab': cm => shiftSelection(cm, -1),
        'Cmd-]': cm => shiftSelection(cm, 1), 'Cmd-[': cm => shiftSelection(cm, -1),
        'Ctrl-]': cm => shiftSelection(cm, 1), 'Ctrl-[': cm => shiftSelection(cm, -1),
    },
})

/**
 * Pure function. JSON.stringify with keys and strings wrapped in spans for color.
 *
 * @param {object} tree
 * @returns {string} HTML
 * @example colorized({a: '1'})  // '{\n    <span class="k">"a"</span>: <span class="s">"1"</span>\n}'
 */
function colorized(tree) {
    const escaped = JSON.stringify(tree, null, 4).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]))
    return escaped.replace(/"((?:[^"\\]|\\.)*)"(:)?/g, (match, text, colon) =>
        colon ? '<span class="k">"' + text + '"</span>:' : '<span class="s">"' + text + '"</span>')
}

/** Command. Re-parses the editor into the right pane; shows the parser's error if there is one. */
function render() {
    try {
        output.innerHTML = colorized(dtab.parse(editor.getValue()))
    } catch (error) {
        output.innerHTML = '<span class="error">' + String(error.message).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])) + '</span>'
    }
}

// The two toggles add or remove a class on the editor's pane; CSS does the rest. Remembered per browser.
const TOGGLES = [['toggle-highlight', 'highlight'], ['toggle-tabs', 'show-tabs']]
const pane = document.querySelector('.pane')
for (const [id, cls] of TOGGLES) {
    const box = document.getElementById(id)
    box.checked = localStorage.getItem(id) !== 'off'
    const apply = () => { pane.classList.toggle(cls, box.checked); localStorage.setItem(id, box.checked ? 'on' : 'off') }
    box.addEventListener('change', apply)
    apply()
}

editor.on('change', render)
editor.setValue(EXAMPLE)
editor.focus()
</script>
