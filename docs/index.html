<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtab - Delta Tab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
    :root {
        --bg: #0d0d0d;
        --panel: #161616;
        --border: #2a2a2a;
        --text: #e6e6e6;
        --muted: #8a8a8a;
        --accent: #5fd7ff;
        --error: #ff6b6b;
        --tab-glyph: #3a3a3a;
        --key-object: #d787d7;   /* same colors as dtab.vim */
        --key-leaf: #5fd7ff;
        --value: #3d8bff;
        --comment: #6a6a6a;
        --block-key: #ffd75f;    /* a $key: yellow, distinct from a leaf key */
        --block-tag: #d7875f;    /* the language tag after a $key: orange, italic */
        --font-mono: "PT Mono", "SF Mono", Menlo, Consolas, monospace;
        --font-size: 14px;
        --line-height: 1.45;
        --tab-size: 4;
        --gap: 12px;
        --pad: 16px;
        --header-height: 48px;
        --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: var(--font-size); }
    header {
        height: var(--header-height); display: flex; align-items: center; gap: var(--gap);
        padding: 0 var(--pad); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: var(--font-size); font-weight: normal; }
    header h1 span { color: var(--accent); }
    header h1 b { color: var(--text); font-weight: normal; }
    header a { color: var(--muted); text-decoration: none; }
    header a:hover { color: var(--text); }
    header .spacer { flex: 1; }
    main { height: calc(100% - var(--header-height)); display: flex; gap: var(--gap); padding: var(--gap); }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .pane .label { display: flex; align-items: center; gap: var(--gap); padding: calc(var(--gap) / 2) var(--pad); color: var(--muted); border-bottom: 1px solid var(--border); }
    .pane .label b { color: var(--text); font-weight: normal; }
    .pane .label .spacer { flex: 1; }
    .pane .label label { cursor: pointer; user-select: none; }
    .pane .label input { vertical-align: middle; accent-color: var(--accent); }
    .CodeMirror, pre {
        flex: 1; height: auto; padding: var(--pad); font: inherit; line-height: var(--line-height); tab-size: var(--tab-size);
        background: transparent; color: var(--text); overflow: auto; white-space: pre;
    }
    .CodeMirror-cursor { border-left-color: var(--text); }
    .CodeMirror-selected { background: var(--border); }
    .highlight .cm-dtab-object-key { color: var(--key-object); }
    .highlight .cm-dtab-leaf-key { color: var(--key-leaf); }
    .highlight .cm-dtab-value { color: var(--value); }
    .highlight .cm-dtab-comment { color: var(--comment); }
    .highlight .cm-dtab-bad-key { color: var(--error); text-decoration: underline wavy; }
    .highlight .cm-dtab-block-key { color: var(--block-key); }
    .highlight .cm-dtab-block-tag { color: var(--block-tag); font-style: italic; }
    /* tokens of a language embedded in a $ block (CodeMirror's standard class names) */
    .highlight .cm-keyword { color: var(--key-object); }
    .highlight .cm-string, .highlight .cm-string-2 { color: var(--value); }
    .highlight .cm-number, .highlight .cm-atom { color: var(--accent); }
    .highlight .cm-comment { color: var(--comment); }
    .highlight .cm-def, .highlight .cm-variable-2, .highlight .cm-tag, .highlight .cm-attribute, .highlight .cm-property { color: var(--key-leaf); }
    .highlight .cm-builtin, .highlight .cm-meta { color: var(--accent); }
    .show-tabs .cm-tab { position: relative; }
    .show-tabs .cm-tab::before { content: "\2192"; position: absolute; left: 0; color: var(--tab-glyph); }   /* → drawn under each tab */
    pre .k { color: var(--key-object); }
    pre .s { color: var(--value); }
    pre .error { color: var(--error); }
    @media (max-width: 720px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
    <h1><span>.dtab</span> &nbsp;<b>Delta Tab</b> &middot; config files made of tab-separated paths</h1>
    <div class="spacer"></div>
    <a href="https://github.com/RyannDaGreat/dtab">GitHub</a>
    <a href="https://pypi.org/project/dtab/">PyPI</a>
    <a href="https://www.npmjs.com/package/deltatab">npm</a>
</header>
<main>
    <section class="pane">
        <div class="label">
            <b>dtab</b> &middot; edit me
            <span class="spacer"></span>
            <label><input type="checkbox" id="toggle-highlight" checked> highlight</label>
            <label><input type="checkbox" id="toggle-tabs" checked> tabs &rarr;</label>
        </div>
        <textarea id="source"></textarea>
    </section>
    <section class="pane">
        <div class="label"><b>JSON</b> &middot; what parse() returns</div>
        <pre id="output"></pre>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/swift/swift.min.js"></script>
<script src="../dtab.js"></script>
<script>
// The repo's own dtab.js when served from a checkout (tests, local use). On GitHub Pages only docs/ is served,
// so that 404s and the same file is loaded from the repo through jsDelivr's GitHub mirror instead. The mirror
// caches a branch for up to ~12 hours; after a push that changes dtab.js, refresh it with
//   curl https://purge.jsdelivr.net/gh/RyannDaGreat/dtab@main/dtab.js
if (typeof dtab === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/gh/RyannDaGreat/dtab@main/dtab.js"><\/script>')
</script>
<script>
'use strict'

// Every feature in one file, with tabs aligned the way a careful author would write them.
const EXAMPLE = [
    ' Tabs separate the steps of a path. The last entry is "key value".',
    'scene\tname Demo scene',
    'scene\twidth 1280',
    'scene\theight 720',
    '',
    ' Paths stack: these three lines all write into camera',
    'camera\tposition\tx 0\ty 5\tz 25',
    'camera\trotation\tx -10',
    'camera\tfov 50',
    '',
    ' Or go deep instead of wide. This is the same tree as one long line.',
    'lights',
    '\tkey',
    '\t\tintensity 1',
    '\t\tcolor\tr 1\tg .9\tb .8',
    '\tfill',
    '\t\tintensity .3',
    '',
    ' a,b writes the same value under several keys',
    'lights\tkey,fill\tcastShadow true',
    '',
    ' Writing a key again replaces it. Last line wins.',
    'camera\tfov 35',
    '',
    ' Every value is a string. Cast the ones you need.',
    'debug\tenabled false\tlevel 2',
    '',
    ' $key is a multiline string. A word after it picks the highlighting; it is not part of the value.',
    '$query sql',
    '\tSELECT name, age',
    '\tFROM users',
    '\tWHERE age > 30',
    '$setup',
    '\t#!/bin/bash',
    '\tpip install rp',
].join('\n')

const KEY_NAME = /^[\p{XID_Start}_]\p{XID_Continue}*$/u   // same key rule as dtab.js (named differently: dtab.js already declares IDENTIFIER globally)

/**
 * Pure function. The CodeMirror token class for one dtab entry (the text between tabs).
 * A key part that is not an identifier is flagged; commas between identifiers are fine.
 *
 * @param {string} key - the entry's key (text before its first space, or the whole entry)
 * @param {boolean} isLeaf - whether the entry has a space (key value)
 * @returns {string}
 * @example entryClass('l1,l2', true)   // 'dtab-leaf-key'
 * @example entryClass('a.b', false)    // 'dtab-bad-key'
 */
function entryClass(key, isLeaf) {
    if (!key.split(',').every(name => KEY_NAME.test(name))) return 'dtab-bad-key'
    return isLeaf ? 'dtab-leaf-key' : 'dtab-object-key'
}

// Language tag on a $ line -> CodeMirror mode. Missing tags: a shebang on the block's first line, else plain.
const TAG_MODES = {
    sql: 'text/x-sql', python: 'python', py: 'python', javascript: 'javascript', js: 'javascript',
    typescript: 'text/typescript', ts: 'text/typescript', html: 'htmlmixed', css: 'css', json: 'application/json',
    yaml: 'yaml', yml: 'yaml', markdown: 'markdown', md: 'markdown',
    bash: 'shell', sh: 'shell', shell: 'shell', zsh: 'shell',
    c: 'text/x-csrc', cpp: 'text/x-c++src', rust: 'rust', go: 'go', java: 'text/x-java', swift: 'swift', dtab: 'dtab',
}

/**
 * Pure function. The language tag implied by a shebang line, or null.
 *
 * @example shebangTag('#!/bin/bash')            // 'bash'
 * @example shebangTag('#!/usr/bin/env python3') // 'python'
 * @example shebangTag('SELECT 1')               // null
 */
function shebangTag(line) {
    if (!line.startsWith('#!')) return null
    const match = line.match(/(bash|zsh|sh|python|node)\d*(?:\s|$)/)
    return match ? ({sh: 'bash', zsh: 'bash', node: 'javascript'}[match[1]] || match[1]) : null
}

/** Pure function. Number of leading tabs of a line. @example lineIndent('\t\tx') // 2 */
const lineIndent = line => line.length - line.replace(/^\t+/, '').length

// A line is entries separated by tab runs. Each entry is a comment (starts with a space), a leaf
// (key, one space, value) or an object key. `$key [tag]` opens a block: every following line indented
// deeper than the $ line is value text, handed to the tag's language mode if there is one.
CodeMirror.defineMode('dtab', config => ({
    // block: the $ block the coming lines belong to ({indent, tag, mode, state}); pending: one opened on the
    // current line, which becomes `block` at the next line start. tagPending: the word after `$key` is next.
    startState: () => ({inValue: false, block: null, pending: null, tagPending: false}),
    copyState: s => ({
        inValue: s.inValue, tagPending: s.tagPending,
        block: s.block && {...s.block, state: s.block.mode ? CodeMirror.copyState(s.block.mode, s.block.state) : null},
        pending: s.pending && {...s.pending, state: s.pending.mode ? CodeMirror.copyState(s.pending.mode, s.pending.state) : null},
    }),
    blankLine(state) { if (state.block && state.block.mode && state.block.mode.blankLine) state.block.mode.blankLine(state.block.state) },
    token(stream, state) {
        if (stream.sol()) {
            state.inValue = false
            state.tagPending = false
            if (state.pending) { state.block = state.pending; state.pending = null }
            if (state.block) {
                const line = stream.string
                if (line.trim() && lineIndent(line) <= state.block.indent) state.block = null   // block over
                else if (line.trim() && !state.block.mode && !state.block.tag) {                 // first line: sniff a shebang
                    const tag = shebangTag(line.trim())
                    state.block.tag = tag || 'text'
                    if (tag) { state.block.mode = CodeMirror.getMode(config, TAG_MODES[tag]); state.block.state = CodeMirror.startState(state.block.mode) }
                }
            }
        }
        if (state.block) {
            if (stream.eatWhile('\t')) return 'tab'
            if (state.block.mode) return state.block.mode.token(stream, state.block.state)
            stream.skipToEnd(); return 'dtab-value'
        }
        if (state.tagPending) { state.tagPending = false; stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-block-tag' }
        if (state.pending) {                                            // rest of a $ line: the value's first lines
            if (stream.eatWhile('\t')) return 'tab'
            stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-value'
        }
        if (state.inValue) {
            state.inValue = false
            stream.skipTo('\t') || stream.skipToEnd()
            return 'dtab-value'
        }
        if (stream.eatWhile('\t')) return 'tab'                        // CodeMirror styles 'tab' tokens as .cm-tab
        if (stream.eat(' ')) { stream.skipTo('\t') || stream.skipToEnd(); return 'dtab-comment' }
        const start = stream.pos
        while (!stream.eol() && stream.peek() !== '\t' && stream.peek() !== ' ') stream.next()
        const key = stream.string.slice(start, stream.pos)
        const isLeaf = stream.peek() === ' '
        if (key.startsWith('$')) {                                     // $key [tag]: the block is the lines below
            const tag = isLeaf ? stream.string.slice(stream.pos + 1).split('\t')[0].trim() : ''
            const mode = TAG_MODES[tag] ? CodeMirror.getMode(config, TAG_MODES[tag]) : null
            state.pending = {indent: lineIndent(stream.string), tag: tag || null, mode, state: mode ? CodeMirror.startState(mode) : null}
            state.tagPending = isLeaf
            return entryClass(key.slice(1), true) === 'dtab-bad-key' ? 'dtab-bad-key' : 'dtab-block-key'
        }
        if (isLeaf) { stream.next(); state.inValue = !stream.eol() }
        return entryClass(key, isLeaf)
    },
}))

const output = document.getElementById('output')
const editor = CodeMirror.fromTextArea(document.getElementById('source'), {
    mode: 'dtab',
    indentWithTabs: true,
    tabSize: 4,
    lineWrapping: false,
    extraKeys: {Tab: cm => cm.replaceSelection('\t')},               // Tab inserts a tab; tabs are the whole point
})

/**
 * Pure function. JSON.stringify with keys and strings wrapped in spans for color.
 *
 * @param {object} tree
 * @returns {string} HTML
 * @example colorized({a: '1'})  // '{\n    <span class="k">"a"</span>: <span class="s">"1"</span>\n}'
 */
function colorized(tree) {
    const escaped = JSON.stringify(tree, null, 4).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]))
    return escaped.replace(/"((?:[^"\\]|\\.)*)"(:)?/g, (match, text, colon) =>
        colon ? '<span class="k">"' + text + '"</span>:' : '<span class="s">"' + text + '"</span>')
}

/** Command. Re-parses the editor into the right pane; shows the parser's error if there is one. */
function render() {
    try {
        output.innerHTML = colorized(dtab.parse(editor.getValue()))
    } catch (error) {
        output.innerHTML = '<span class="error">' + String(error.message).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])) + '</span>'
    }
}

// The two toggles add or remove a class on the editor's pane; CSS does the rest. Remembered per browser.
const TOGGLES = [['toggle-highlight', 'highlight'], ['toggle-tabs', 'show-tabs']]
const pane = document.querySelector('.pane')
for (const [id, cls] of TOGGLES) {
    const box = document.getElementById(id)
    box.checked = localStorage.getItem(id) !== 'off'
    const apply = () => { pane.classList.toggle(cls, box.checked); localStorage.setItem(id, box.checked ? 'on' : 'off') }
    box.addEventListener('change', apply)
    apply()
}

editor.on('change', render)
editor.setValue(EXAMPLE)
editor.focus()
</script>
</body>
</html>
